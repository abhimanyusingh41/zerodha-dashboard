name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy dashboard code to VM
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          timeout: 60s
          command_timeout: 120s
          script: |
            set -e
            cd /opt/zerodha-dashboard
            echo "Pulling latest dashboard code..."
            git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/abhimanyusingh41/zerodha-dashboard.git"
            git pull origin main
            echo "Restarting dashboard service..."
            sudo systemctl restart dashboard.service
            sleep 3
            sudo systemctl is-active dashboard.service
            echo "✅ Dashboard deployed and running"
        continue-on-error: true

      - name: Report result
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ Dashboard deployed successfully"
          else
            echo "⚠️  VM may be offline — dashboard will update on next VM startup"
          fi
