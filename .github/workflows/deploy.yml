name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pull latest dashboard code + restart service
        run: |
          az vm run-command invoke \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --parameters "${{ secrets.GH_PAT }}" \
            --scripts '
              export HOME=/root
              GH_PAT=$1
              set -e

              cd /opt/zerodha-dashboard
              git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/abhimanyusingh41/zerodha-dashboard.git"
              git fetch origin
              git reset --hard origin/main
              chown -R azureuser:azureuser /opt/zerodha-dashboard
              echo "dashboard: $(git log --oneline -1)"

              systemctl restart dashboard.service
              sleep 3
              systemctl is-active dashboard.service && echo "✅ Dashboard running on :8001" || echo "❌ Dashboard failed to start"
            '
