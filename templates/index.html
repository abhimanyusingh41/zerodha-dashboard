<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Agent Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- Header -->
<div class="topbar">
  <div>
    <div class="title-main">Trading <span>Agent</span></div>
    <div class="title-sub">Dashboard</div>
  </div>
  <div class="topbar-right">
    <div class="live-row"><span class="live-dot"></span> Live</div>
    <div id="last-updated" class="updated-text">Loading…</div>
  </div>
</div>

<!-- Strategy cards (horizontal scroll) -->
<div class="strat-scroll">
  <div class="strat-cards" id="strat-cards">
    <div class="strat-card skeleton-card"></div>
    <div class="strat-card skeleton-card"></div>
    <div class="strat-card skeleton-card"></div>
    <div class="strat-card skeleton-card"></div>
  </div>
</div>

<!-- Stats grid -->
<div class="stats-grid">
  <div class="stat-cell">
    <div class="stat-label">TRADES TODAY</div>
    <div class="stat-big" id="s-trades">—</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">OPEN</div>
    <div class="stat-big" id="s-open">0</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">WIN RATE</div>
    <div class="stat-big" id="s-wr">—</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">W / L</div>
    <div class="stat-big" id="s-wl">—</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">TODAY P&amp;L</div>
    <div class="stat-big" id="s-today-pnl">—</div>
  </div>
  <div class="stat-cell">
    <div class="stat-label">ALL-TIME P&amp;L</div>
    <div class="stat-big" id="s-total-pnl">—</div>
  </div>
</div>

<!-- Open Positions -->
<div class="section">
  <div class="section-hdr">
    OPEN POSITIONS <span class="badge" id="open-count">0</span>
  </div>
  <div class="card-box" id="positions-box">
    <div class="empty-msg">No open positions</div>
  </div>
</div>

<!-- Trade History -->
<div class="section">
  <div class="section-hdr">TRADE HISTORY</div>
  <div class="card-box">
    <div class="filter-row">
      <input type="date" id="date-picker" />
      <input type="text" id="symbol-filter" placeholder="Symbol…" />
    </div>
    <div class="filter-row" style="margin-top:8px">
      <select id="strat-filter">
        <option value="">All Strategies</option>
        <option value="SCREENER">LLM Agent</option>
        <option value="ORB">ORB</option>
        <option value="index_options">Index Options</option>
        <option value="sensex_straddle">SENSEX Straddle</option>
      </select>
      <span class="muted small" id="trade-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>EXIT TIME</th>
            <th>SYMBOL</th>
            <th>ACTION</th>
            <th>ENTRY</th>
            <th>EXIT</th>
            <th>P&amp;L</th>
          </tr>
        </thead>
        <tbody id="trades-tbody">
          <tr><td colspan="6" class="empty-msg">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Live Log -->
<div class="section">
  <div class="section-hdr">
    LIVE LOG <span class="muted" style="font-size:10px;font-weight:400;letter-spacing:0">(15s refresh)</span>
  </div>
  <div class="log-box" id="log-box">Loading…</div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
